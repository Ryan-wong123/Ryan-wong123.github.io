name: Sync LinkedIn

on:
  schedule:
    - cron: '17 2 1 * *'   # 1st of every month, 02:17 UTC
  workflow_dispatch:        # run manually from the Actions tab

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-linkedin
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch LinkedIn profile and update data/profile.json
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          LINKEDIN_URL: ${{ vars.LINKEDIN_URL || 'https://www.linkedin.com/in/ryan-wong-ke/' }}
          APIFY_ACTOR: ${{ vars.APIFY_ACTOR }}
          SUMMARY_FILE: ${{ runner.temp }}/summary.md
        run: node scripts/sync-linkedin.js

      - name: Rebuild index.html
        run: node scripts/build.js

      - name: Open pull request if anything changed
        uses: peter-evans/create-pull-request@v7
        with:
          branch: linkedin-sync
          delete-branch: true
          base: main
          commit-message: 'Sync portfolio with LinkedIn'
          title: 'Sync portfolio with LinkedIn'
          labels: linkedin-sync
          body-path: ${{ runner.temp }}/summary.md
          add-paths: |
            data/profile.json
            index.html

      # A silent failure means the site quietly goes stale, so surface it.
      - name: Open an issue if the sync failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'LinkedIn sync failed';
            const open = await github.paginate(github.rest.issues.listForRepo,
              { ...context.repo, state: 'open' });
            if (open.some(i => i.title === title)) return;
            await github.rest.issues.create({ ...context.repo, title,
              body: `The monthly LinkedIn sync failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nCommon causes: expired/empty \`APIFY_TOKEN\`, Apify credit exhausted, actor output format changed, or the scrape looked incomplete (safety check).` });
